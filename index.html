<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="IoT-based smart parking dashboard for monitoring parking slot availability and reservations."
  >
  <title>Smart Parking Dashboard</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="locationModal" class="modal">
  <div class="modal-content">
    <h3>Select Parking Location</h3>

    <select id="locationSelect">
      <option value="">-- Choose Location --</option>
    </select>

    <button type="button" onclick="confirmLocation()">
      Continue
    </button>
  </div>
</div>

<nav class="navbar">
  <h1>Smart Parking System</h1>

  <div>
    <button type="button" onclick="changeLocation()">
      Change Location
    </button>

    <button type="button" onclick="loadSlotData()">
      Refresh
    </button>
  </div>
</nav>

<section class="hero">
  <h2 id="locationTitle">Smart Park</h2>
  <p>IoT-Based Parking Availability Monitoring</p>
</section>

<section class="stats">
  <div class="stat green">
    <h3 id="freeCount">--</h3>
    <span>Available</span>
  </div>

  <div class="stat red">
    <h3 id="occupiedCount">--</h3>
    <span>Occupied</span>
  </div>

  <div class="stat orange">
    <h3 id="reservedCount">--</h3>
    <span>Reserved</span>
  </div>
</section>

<main id="slots" class="slot-grid"></main>

<div id="alertModal" class="modal">
  <div class="modal-content">
    <h3 id="alertText"></h3>

    <button type="button" onclick="closeAlert()">
      OK
    </button>
  </div>
</div>

<footer>
  <p>Smart Parking System</p>
</footer>

<script src="script.js"></script>

<script>
async function loadLocations() {
  const locationSelect = document.getElementById("locationSelect");

  try {
    const response = await fetch(
      `${BACKEND_URL}?action=getLocations`
    );

    if (!response.ok) {
      throw new Error(`HTTP error: ${response.status}`);
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error(
        data.error || "Unable to load parking locations."
      );
    }

    locationSelect.innerHTML =
      '<option value="">-- Choose Location --</option>';

    data.locations.forEach(location => {
      const option = document.createElement("option");

      option.value = location.locationId;
      option.textContent = location.locationName;

      locationSelect.appendChild(option);
    });

    const selectedLocationId =
      localStorage.getItem("selectedLocationId");

    if (selectedLocationId) {
      locationSelect.value = selectedLocationId;
    }
  } catch (error) {
    console.error("Failed to load locations:", error);

    showMessage(
      "Unable to load parking locations. Please try again."
    );
  }
}

function confirmLocation() {
  const locationSelect =
    document.getElementById("locationSelect");

  const locationId = locationSelect.value;

  if (!locationId) {
    showMessage("Please select a parking location.");
    return;
  }

  localStorage.setItem(
    "selectedLocationId",
    locationId
  );

  document.getElementById(
    "locationModal"
  ).style.display = "none";

  loadSlotData();
}

function changeLocation() {
  document.getElementById(
    "locationModal"
  ).style.display = "block";

  loadLocations();
}

function closeAlert() {
  document.getElementById(
    "alertModal"
  ).style.display = "none";
}

async function initializeDashboard() {
  await loadLocations();

  const selectedLocationId =
    localStorage.getItem("selectedLocationId");

  if (!selectedLocationId) {
    document.getElementById(
      "locationModal"
    ).style.display = "block";

    return;
  }

  loadSlotData();
}

document.addEventListener(
  "DOMContentLoaded",
  initializeDashboard
);
</script>

</body>
</html>
